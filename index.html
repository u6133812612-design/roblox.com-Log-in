<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Login - Demo</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2f2;
    }

    .login-box {
      width: 360px;
      padding: 32px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 25px;
      letter-spacing: -1px;
    }

    .demo {
      font-size: 12px;
      color: #777;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    #message {
      margin-top: 15px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="logo">BLOCKWORLD</div>

    <div class="demo">
      DEMO — nu colectează date reale
    </div>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button onclick="demoLogin()">Log In</button>

    <div id="message"></div>
  </div>

  <script>
    function demoLogin() {
      document.getElementById("message").textContent =
        "Acesta este doar un demo. Datele nu sunt trimise nicăieri.";
    }
  </script>

</body>
</html>
