<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #17191c;
      color: #fff;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 390px;
      background: #24272b;
      border-radius: 10px;
      padding: 38px 34px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #ffffff;
      color: #17191c;
      border-radius: 12px;

      font-size: 27px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin: 0 0 28px;
      font-size: 25px;
      font-weight: 700;
    }

    .input {
      width: 100%;
      height: 48px;
      margin-bottom: 14px;
      padding: 0 14px;

      border: 1px solid #44484e;
      border-radius: 7px;

      background: #191b1e;
      color: white;

      font-size: 15px;
      outline: none;
    }

    .input::placeholder {
      color: #999;
    }

    .input:focus {
      border-color: #777;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 6px;

      border: none;
      border-radius: 7px;

      background: #ffffff;
      color: #17191c;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    .login-button:hover {
      background: #e5e5e5;
    }

    .forgot {
      display: block;
      margin-top: 18px;

      text-align: center;
      color: #bdbdbd;
      text-decoration: none;
      font-size: 14px;
    }

    .forgot:hover {
      color: white;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #777;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #3d4146;
    }

    .create-button {
      width: 100%;
      height: 46px;

      border: 1px solid #555;
      border-radius: 7px;

      background: transparent;
      color: white;

      font-size: 14px;
      cursor: pointer;
    }

    .create-button:hover {
      background: #303338;
    }

    .message {
      min-height: 20px;
      margin-top: 16px;

      text-align: center;
      color: #aaa;
      font-size: 13px;
    }

    .demo {
      margin-top: 22px;
      text-align: center;

      color: #777;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">G</div>

    <h1>Log In</h1>

    <input
      class="input"
      type="text"
      placeholder="Username or email"
      autocomplete="off"
    >

    <input
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button class="login-button" onclick="loginDemo()">
      Log In
    </button>

    <a class="forgot" href="#" onclick="return false;">
      Forgot Password or Username?
    </a>

    <div class="divider">
      OR
    </div>

    <button class="create-button" onclick="return false;">
      Create Account
    </button>

    <div id="message" class="message"></div>

    <div class="demo">
      Demo — datele introduse nu sunt salvate sau trimise.
    </div>

  </div>

  <script>
    function loginDemo() {
      document.getElementById("message").textContent =
        "Acesta este un formular demonstrativ.";
    }
  </script>

</body>
</html>
