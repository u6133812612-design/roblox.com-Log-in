<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 360px;
      padding: 30px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 24px;
      color: #222;
    }

    .input {
      width: 100%;
      height: 44px;
      margin-bottom: 12px;
      padding: 0 14px;
      border: 1px solid #c8c8c8;
      border-radius: 5px;
      background: #fafafa;
      font-size: 15px;
      outline: none;
    }

    .input:focus {
      border-color: #777;
      background: #fff;
    }

    .login-button {
      width: 100%;
      height: 44px;
      margin-top: 4px;
      border: 0;
      border-radius: 5px;
      background: #222;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-button:hover {
      background: #333;
    }

    .links {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .links a {
      color: #555;
      font-size: 14px;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .message {
      margin-top: 16px;
      font-size: 13px;
      color: #555;
      min-height: 18px;
    }

    .demo-note {
      margin-top: 20px;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <h1 class="title">Log In</h1>

    <input
      class="input"
      type="text"
      placeholder="Username"
      autocomplete="off"
    >

    <input
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button class="login-button" onclick="loginDemo()">
      Log In
    </button>

    <div class="links">
      <a href="#" onclick="return false;">Forgot Password?</a>
      <a href="#" onclick="return false;">Create Account</a>
    </div>

    <div id="message" class="message"></div>

    <div class="demo-note">
      Demo — informațiile introduse nu sunt salvate sau trimise.
    </div>

  </div>

  <script>
    function loginDemo() {
      document.getElementById("message").textContent =
        "Acesta este un formular demonstrativ.";
    }
  </script>

</body>
</html>
