<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Form</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #17191c;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 360px;
      background: #24272b;
      padding: 30px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    input {
      width: 100%;
      height: 46px;
      margin-bottom: 14px;
      padding: 0 12px;
      box-sizing: border-box;
      border: 1px solid #444;
      border-radius: 7px;
      background: #191b1e;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 7px;
      background: white;
      color: #17191c;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      text-align: center;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Test Form</h1>

    <input
      id="testUsername"
      type="text"
      placeholder="Test username"
      autocomplete="off"
    >

    <button onclick="sendTest()">
      Send Test
    </button>

    <div id="result"></div>
  </div>

  <script>
    function sendTest() {
      const username =
        document.getElementById("testUsername").value;

      if (username.trim() === "") {
        document.getElementById("result").textContent =
          "Scrie un username de test.";
        return;
      }

      document.getElementById("result").textContent =
        "Ai trimis: " + username;
    }
  </script>

</body>
</html>
